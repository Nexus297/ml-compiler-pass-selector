name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # allows manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app and wake if sleeping
        env:
          APP_URL: https://ml-compiler-optimizer.streamlit.app/
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)

              button = page.get_by_role("button", name="Yes, get this app back up!")
              try:
                  button.wait_for(timeout=10000)
                  button.click()
                  print("Wake-up button clicked")
                  page.wait_for_timeout(30000)   # let the app boot
              except Exception:
                  print("App already awake")

              page.wait_for_timeout(15000)       # keep the session open briefly
              browser.close()
          EOF
